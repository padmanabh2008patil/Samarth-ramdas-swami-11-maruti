<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>मारुती फोटो</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
    background:#f5f5f5;
}

.back{
    display:inline-block;
    margin:20px;
    background:#e65100;
    color:#fff;
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
}

h1{
    text-align:center;
    color:#e65100;
    margin-bottom:20px;
}

.gallery{
    width:90%;
    max-width:1100px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.gallery img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    transition:.3s;
}

.gallery img:hover{
    transform:scale(1.03);
}

#viewer{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    justify-content:center;
    align-items:center;
}

#viewer img{
    max-width:90%;
    max-height:90%;
    border-radius:10px;
}

</style>

</head>

<body>

<a href="maruti.html" class="back">← मागे जा</a>

<h1 id="title"></h1>

<div class="gallery" id="gallery"></div>

<div id="viewer" onclick="closeImage()">
<img id="bigImage">
</div>

<script>

const selected=localStorage.getItem("marutiName");

document.getElementById("title").innerHTML=selected;

fetch("data/maruti.json")
.then(res=>res.json())
.then(data=>{

const maruti=data.find(item=>item.name===selected);

if(!maruti) return;

let html="";

maruti.photos.forEach(photo=>{

html+=`
<img src="${photo}" onclick="showImage('${photo}')">
`;

});

document.getElementById("gallery").innerHTML=html;

});

function showImage(src){

document.getElementById("viewer").style.display="flex";

document.getElementById("bigImage").src=src;

}

function closeImage(){

document.getElementById("viewer").style.display="none";

}

</script>

</body>
</html>
