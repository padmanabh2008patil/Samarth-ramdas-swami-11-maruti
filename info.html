<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>मारुती माहिती</title>

<link rel="stylesheet" href="css/style.css">

<style>

.container{
    width:90%;
    max-width:900px;
    margin:30px auto;
}

.box{
    background:#fff;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    line-height:1.8;
}

.back{
    display:inline-block;
    margin:20px;
    text-decoration:none;
    background:#e65100;
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
}

h1{
    text-align:center;
    color:#e65100;
    margin:20px 0;
}

</style>

</head>

<body>

<a href="maruti.html" class="back">← मागे जा</a>

<h1 id="title"></h1>

<div class="container">

<div class="box" id="history">

लोड होत आहे...

</div>

</div>

<script>

const selected = localStorage.getItem("marutiName");

document.getElementById("title").innerHTML = selected || "मारुती माहिती";

fetch("data/maruti.json")

.then(res => {
    if (!res.ok) {
        throw new Error("maruti.json सापडली नाही");
    }
    return res.json();
})

.then(data => {

    const maruti = data.find(item => item.name === selected);

    if (maruti) {

        document.getElementById("history").innerHTML =
        maruti.history || "या मारुतीची माहिती लवकरच उपलब्ध होईल.";

    } else {

        document.getElementById("history").innerHTML =
        "या मारुतीची माहिती सापडली नाही.";

    }

})

.catch(error => {

    console.log(error);

    document.getElementById("history").innerHTML =
    "माहिती लोड करताना समस्या आली. कृपया पुन्हा प्रयत्न करा.";

});

</script>

</body>
</html>
